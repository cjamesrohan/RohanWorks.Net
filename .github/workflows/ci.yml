name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      BUILD_CONFIG: Release

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c $BUILD_CONFIG --no-restore

      - name: Test
        run: dotnet test -c $BUILD_CONFIG --no-restore --no-build --verbosity normal

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet pack -c $BUILD_CONFIG --no-restore --no-build -o ./artifacts

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

      # Publish step intentionally omitted — add NuGet push here when ready to publish
